<!DOCTYPE HTML>
<html>
	<head>
		<title>Nisarga Bhaskar</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<div id="main">
						<div class="inner">

							<!-- Header -->
								<header id="header">
									<a href="index.html" class="logo">Nisarga Bhaskar </a>
									<ul class="icons">
										<!-- <li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li> -->
										<li><a href="https://www.linkedin.com/in/nisargabhaskar/" class="icon brands fa-linkedin"><span class="label">Linkedin</span></a></li>
										<!-- <li><a href="#" class="icon brands fa-snapchat-ghost"><span class="label">Snapchat</span></a></li> -->
										<li><a href="https://www.instagram.com/nisarga.bhaskar/" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
										<li><a href="https://github.com/nisargabhaskar" class="icon brands fa-github"><span class="label">Github</span></a></li>
									</ul>
								</header>

							<!-- Content -->
                            <div id="pomodoro">
                                <div id="clock">
                                    <div id="timer">
                                        <div id="title">Time to lock in </div>
                                        <div id="countdown">
                                            <span id="minutes">30</span>
                                            <span>:</span>
                                            <span id="seconds">00</span>
                                        </div>
                                        <div id="controls" class="reset">
                                            <div id="start"><i class="fas fa-play"></i> Start</div>
                                            <div id="pause"><i class="fas fa-pause"></i> Pause</div>
                                            <div id="reset"><i class="fas fa-sync-alt"></i> Reset</div>
                                        </div>
                                    </div>
                                </div>
                                <div id="options">
                                    <div id="session">
                                    <i id="incrSession" class="fas fa-angle-double-up"></i>
                                    <span class="option-title">Session</span>
                                    <input id="sessionInput" type="number" value="30" max="60" min="5">
                                    <i id="decrSession" class="fas fa-angle-double-down"></i>
                                    </div>
                                    <div id="break">
                                    <i id="incrBreak" class="fas fa-angle-double-up"></i>
                                    <span class="option-title">Break</span>
                                    <input id="breakInput" type="number" value="5" max="10" min="1">
                                    <i id="decrBreak" class="fas fa-angle-double-down"></i>
                                    </div>
                                </div>
                            </div>
        
            <audio id="alarmSound" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
            <script src="assets/js/pomodoro.js"></script>

	</body>
</html>
